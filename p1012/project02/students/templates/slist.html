<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,th,td{border:1px solid black; border-collapse: collapse;}
        th,td{width:150px; height:150px;}
    </style>
</head>
<body>
    <h1>학생정보리스트</h1>
    <table>
        <tr>
        <th>이름</th>
        <th>학과</th>
        <th>나이</th>
        </tr>
        {% for s in slist %}
        <tr>
        <td>{{s.name}}</td>
        <td>{{s.major}}</td>
        <td>{{s.age}}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
